name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test
        run: pwsh -File dd.ps1 test

      # The structural audit walks the page cache and hash table at the exit
      # of every mutating call. It perturbs cache timing, so it is a separate
      # pass rather than the default.
      - name: Audit build
        run: pwsh -File dd.ps1 audit --yes

      # A leaked page pin is invisible at the default 32 MiB cache and
      # surfaces as SPIKEDB_FULL once the clock sweep runs out of victims.
      - name: Low-memory passes
        run: pwsh -File dd.ps1 lowmem --yes

      - name: Sanitizers (ASan, including Debug flag compatibility)
        run: pwsh -File dd.ps1 asan --config Debug --yes

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc cmake ninja-build

      - name: Build and test
        run: pwsh -File dd.ps1 test

      - name: Audit build
        run: pwsh -File dd.ps1 audit --yes

      - name: Low-memory passes
        run: pwsh -File dd.ps1 lowmem --yes

      # The fixed-width leaf layout casts uint64_t/uint32_t into a packed
      # page, so misalignment and out-of-bounds are the failure modes that
      # matter most here.
      - name: Sanitizers (ASan + UBSan)
        run: pwsh -File dd.ps1 asan --yes
